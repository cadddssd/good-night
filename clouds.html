<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b35"><title>ก้อนเมฆบอกฝันดี ☁️</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="clouds.css?v=20261116-2"></head><body><div class="cloud-sky" aria-hidden="true"><div class="cloud-moon"></div><div id="cloudStars"></div></div><main class="cloud-page"><header><p class="kicker">A SKY FULL OF KIND WORDS</p><h1>ก้อนเมฆบอกฝันดี ☁️</h1><p class="lead">ทุกข้อความคือความอบอุ่นเล็ก ๆ ที่ส่งถึงกันในค่ำคืนนี้</p></header><section class="compose"><h2>ฝากข้อความไว้บนท้องฟ้า ✨</h2><form id="cloudForm"><label for="cloudName">ชื่อผู้ส่ง <small>(ไม่บังคับ)</small></label><input id="cloudName" maxlength="30" placeholder="จะใช้นามแฝงหรือไม่ระบุก็ได้"><label for="cloudMessage">ข้อความบอกฝันดี</label><textarea id="cloudMessage" maxlength="300" rows="3" required placeholder="คืนนี้อยากฝากคำพูดดี ๆ อะไรไว้บ้าง..."></textarea><div class="form-foot"><small id="charCount">0/300</small><button id="sendButton">ปล่อยข้อความขึ้นฟ้า 💌</button></div></form><p id="status" role="status" aria-live="polite">กำลังเชื่อมต่อท้องฟ้า...</p></section><section class="wall"><div class="wall-head"><h2>ข้อความจากก้อนเมฆ</h2><span id="total">0 ข้อความ</span></div><div id="cloudList" class="cloud-list" aria-live="polite"></div><p id="empty" hidden>ท้องฟ้ายังว่างอยู่... มาเป็นคนแรกที่ฝากคำฝันดีนะ 🌙</p></section><footer>ส่งต่อความใจดีให้กัน ☾ <a href="index.html">กลับสู่หน้า Good Night</a></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="clouds.js"></script></body></html>
