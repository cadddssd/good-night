<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17142f">
  <title>Good Night 🌙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="moon"></div><div id="stars"></div><div id="floaties"></div></div>
  <main class="card">
    <p class="eyebrow">A little note for tonight</p>
    <h1>Good Night</h1>
    <p class="subtitle">คืนนี้พักผ่อนให้สบายนะ ✨</p>
    <div class="message-wrap" aria-live="polite"><span class="message-sparkle sparkle-one" aria-hidden="true">✦</span><span class="message-sparkle sparkle-two" aria-hidden="true">✧</span><span class="message-cloud cloud-one" aria-hidden="true">☁</span><span class="message-cloud cloud-two" aria-hidden="true">☁</span><p id="message" class="message"></p></div>
    <p id="dateLabel" class="date-label"></p>
    <button id="newMessage" class="soft-button" type="button">ขอข้อความอีกอัน 💌</button>
    <p id="messageStatus" class="message-status" aria-live="polite"></p>
    <button id="themeBtn" class="theme-button" type="button">เปลี่ยนบรรยากาศ 🌌</button>
    <div class="music-control">
      <audio id="goodNightMusic" preload="none">
        <source src="assets/good-night.mp3" type="audio/mpeg">
      </audio>
      <div class="music-player">
        <button id="prevTrack" class="track-button" type="button" aria-label="เพลงก่อนหน้า">⏮</button>
        <button id="musicBtn" class="music-button" type="button" aria-pressed="false">
        <span id="musicIcon" aria-hidden="true">🎵</span><span id="musicText">เปิดเพลงพื้นหลัง</span><span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
        <button id="nextTrack" class="track-button" type="button" aria-label="เพลงถัดไป">⏭</button>
        <button id="volumeToggle" class="track-button volume-toggle" type="button" aria-label="ปรับระดับเสียง" aria-expanded="false" aria-controls="volumePanel">
          <span id="volumeIcon" aria-hidden="true">🔊</span>
        </button>
      </div>
      <p id="trackTitle" class="track-title">Starry Sky (Calm Dreamy Piano)</p>
      <div id="volumePanel" class="volume-panel" hidden>
        <span id="volumeValue" class="volume-value">25%</span>
        <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.05" value="0.25" aria-label="ระดับเสียง">
      </div>
      <p id="musicStatus" class="music-status" aria-live="polite">เพลงบรรเลงเปียโนเบา ๆ สำหรับคืนนี้</p>
      <p class="music-credit">เพลง <a href="https://pixabay.com/music/modern-classical-starry-sky-calm-dreamy-piano-235728/" target="_blank" rel="noopener noreferrer">Starry Sky (Calm Dreamy Piano)</a> โดย noemazeek</p>
    </div>
    <p class="signature">ส่งความคิดถึงให้คืนนี้ 🌙</p>

    <a class="cloud-guestbook-link" href="clouds.html">
      <span class="cloud-link-icon" aria-hidden="true">☁️</span>
      <span class="cloud-link-copy"><strong>แสดงก้อนเมฆบอกฝันดี</strong><small>อ่านข้อความดี ๆ จากทุกคนในค่ำคืนนี้</small></span>
      <span class="cloud-link-arrow" aria-hidden="true">↗</span>
    </a>

ion>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
